<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Corvus Weather FX · 手机预览</title>
<style>
  :root{
    --ink:#f2f5f7; --ink-dim:rgba(242,245,247,.6);
    --panel:rgba(22,26,31,.72); --panel-line:rgba(255,255,255,.1);
    --accent:#9fd8ff;
    --phone-w:430px; --phone-h:min(900px, calc(100vh - 48px));
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:#070b0c;color:var(--ink);
    font:14px/1.45 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;gap:28px;
    padding:24px;min-height:100vh;
  }

  /* ---------- 手机框 ---------- */
  .phone{
    position:relative;flex:none;width:var(--phone-w);height:var(--phone-h);min-height:640px;
    overflow:hidden;border-radius:36px;background:#101619;
    box-shadow:0 32px 90px rgba(0,0,0,.6),0 0 0 7px rgba(255,255,255,.04),0 0 0 1px rgba(255,255,255,.22);
    isolation:isolate;
  }
  #wall{
    position:absolute;inset:0;z-index:0;
    background-size:cover;background-position:center;
    transition:background-image .3s ease;
  }
  .layer{
    position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;
    pointer-events:none;opacity:0;transition:opacity .45s ease;
  }
  .layer.on{opacity:1}
  .shade{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,.04) 34%,rgba(0,0,0,.34));
  }

  /* ---------- 假聊天 ---------- */
  .chat{
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 13px calc(12px + env(safe-area-inset-bottom));
  }
  .top{
    display:flex;align-items:center;gap:9px;height:50px;padding:0 13px;flex:none;
    border:1px solid rgba(255,255,255,.12);border-radius:18px;
    background:rgba(10,15,18,.34);backdrop-filter:blur(16px) saturate(125%);
    -webkit-backdrop-filter:blur(16px) saturate(125%);
    box-shadow:0 8px 24px rgba(0,0,0,.14);
  }
  .orb{width:9px;height:9px;border-radius:99px;background:#c9f0df;box-shadow:0 0 12px #c9f0df}
  .brand{font-size:16px;font-weight:620;letter-spacing:.04em}
  .sub{font-size:11px;color:var(--ink-dim)}
  .grow{flex:1}
  .iconbtn{
    width:30px;height:30px;border-radius:50%;border:0;cursor:default;
    background:rgba(255,255,255,.12);color:var(--ink);font-size:15px;line-height:1;
    display:grid;place-items:center;
  }
  .messages{
    flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px;
    padding:16px 4px 8px;
  }
  .date{align-self:center;font-size:11px;color:rgba(255,255,255,.55);margin-bottom:2px}
  .row{display:flex;justify-content:flex-start}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:78%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;
    color:rgba(255,255,255,.94);background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }
  .row.me .bubble{background:rgba(159,216,255,.2);border-color:rgba(159,216,255,.3)}
  .composer{
    flex:none;display:flex;align-items:center;gap:8px;padding-top:8px;
  }
  .input{
    flex:1;height:44px;display:flex;align-items:center;padding:0 15px;border-radius:16px;
    font-size:14px;color:rgba(255,255,255,.5);
    background:rgba(12,17,20,.52);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .sendbtn{
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(159,216,255,.4);
    background:rgba(159,216,255,.18);color:#eaf7ff;font-size:16px;display:grid;place-items:center;
  }

  /* ---------- 控制面板 ---------- */
  #panel{
    width:340px;max-width:calc(100vw - 28px);max-height:calc(100vh - 48px);overflow:auto;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
    backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
    box-shadow:0 18px 50px rgba(0,0,0,.35);padding:16px;
  }
  #panel h1{font-size:15px;margin:2px 0 2px;letter-spacing:.02em}
  #panel .sub-line{color:var(--ink-dim);font-size:12px;margin-bottom:12px}
  .group{margin:12px 0 0}
  .group-title{font-size:11px;letter-spacing:.12em;color:var(--ink-dim);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    appearance:none;border:1px solid var(--panel-line);background:rgba(255,255,255,.06);
    color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s;
  }
  .chip:hover{background:rgba(255,255,255,.12)}
  .chip.on{background:rgba(159,216,255,.22);border-color:rgba(159,216,255,.55);color:#eaf7ff}
  .slider{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:8px;
    margin:8px 0;font-size:13px}
  .slider span:first-child{color:var(--ink-dim)}
  .slider output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-dim)}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent}

  .wall-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .swatch{
    width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
    cursor:pointer;padding:0;position:relative;
  }
  .swatch.on{outline:2px solid var(--accent);outline-offset:2px}
  .filebtn{
    appearance:none;border:1px solid rgba(159,216,255,.45);border-radius:10px;
    background:rgba(159,216,255,.16);color:#eaf7ff;padding:9px 14px;cursor:pointer;font-size:13px;
  }
  .wall-note{font-size:11px;color:var(--ink-dim);margin-top:8px;line-height:1.6}
  a.backlink{display:inline-block;margin-top:14px;font-size:12px;color:var(--ink-dim);text-decoration:none}
  a.backlink:hover{color:var(--ink)}

  /* 截图模式：只留手机，外面控制都收起来 */
  body.shot{display:flex;align-items:center;justify-content:center;padding:20px;background:#0b1013}
  body.shot #panel{display:none}
  /* 截图时不管窗口多窄，都按手机原尺寸出图 */
  body.shot .phone{width:430px!important;height:900px!important;min-height:0}
  body.shot .phone{--phone-h:900px}

  @media (max-width: 860px){
    body{flex-direction:column;gap:16px;padding:14px;align-items:center}
    .phone{width:min(100%,430px);height:min(760px, calc(100vh - 320px));min-height:520px}
    #panel{width:min(100%,430px);order:2}
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="wall"></div>
  <div class="shade"></div>
  <iframe id="f-glass"   class="layer" src="glass.html"   title="雨水玻璃"></iframe>
  <iframe id="f-caustic" class="layer" src="caustic.html" title="焦散水波"></iframe>
  <iframe id="f-fx"      class="layer" src="fx.html"      title="雨雪特效"></iframe>
  <iframe id="f-sky"     class="layer" src="sky.html"     title="天空特效"></iframe>

  <div class="chat" id="chat">
    <header class="top">
      <span class="orb"></span>
      <span class="brand">Corvus</span>
      <span class="sub">陪伴空间</span>
      <span class="grow"></span>
      <button class="iconbtn" aria-hidden="true">⋯</button>
    </header>

    <main class="messages" id="messages">
      <div class="date">今天 · 雨窗</div>
      <div class="row"><div class="bubble" data-b="m0">外面好像下雨了。</div></div>
      <div class="row me"><div class="bubble" data-b="m1">真的欸，窗户上全是水。</div></div>
      <div class="row"><div class="bubble" data-b="m2">这场雨下得挺温柔的，落在玻璃上像一层雾。</div></div>
      <div class="row me"><div class="bubble" data-b="m3">你那边的云是什么颜色？</div></div>
      <div class="row"><div class="bubble" data-b="m4">灰里透一点暖，像有人在云后面点了一盏很低的灯。</div></div>
      <div class="row me"><div class="bubble" data-b="m5">雨停之前，我都在。</div></div>
      <div class="row"><div class="bubble" data-b="m6">好。我把雨声放低一点。</div></div>
      <div class="row me"><div class="bubble" data-b="m7">嗯，就这样待一会儿。</div></div>
    </main>

    <footer class="composer">
      <div class="input" data-b="input">说点什么…</div>
      <div class="sendbtn" aria-hidden="true">↑</div>
    </footer>
  </div>
</div>

<div id="panel">
  <h1>Corvus 天气特效</h1>
  <div class="sub-line">手机里的样子 · 本地预览 · 不上传任何东西</div>

  <div class="group">
    <div class="group-title">特效</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="group" id="params"></div>

  <div class="group">
    <div class="group-title">壁纸</div>
    <div class="wall-row" id="wallRow"></div>
    <button class="filebtn" id="wallBtn" type="button">选一张自己的壁纸</button>
    <input id="wallFile" type="file" accept="image/*" hidden>
    <div class="wall-note">点小方块换六张预置壁纸；自己的图只在你这台设备上预览，不会上传到任何服务器。刷新就回到默认。</div>
  </div>

  <a class="backlink" href="index.html">← 回到全屏对比台</a>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- 特效表（和 index.html 同一套） ---------------- */
  const EFFECTS = {
    off:     { label: '关',       page: null },
    glass:   { label: '雨水玻璃', page: 'glass' },
    slant:   { label: '斜飘雪花', page: 'fx',  fx: { effect: 'slant-snow',  count: 50, speed: 0.55, opacity: 100 } },
    streak:  { label: '垂直雨丝', page: 'fx',  fx: { effect: 'rain-streak', count: 60, speed: 0.9,  opacity: 100 } },
    soft:    { label: '柔光飘雪', page: 'fx',  fx: { effect: 'soft-snow',   count: 70, speed: 1,    opacity: 90  } },
    fog:     { label: '柔雾',     page: 'fx',  fx: { effect: 'soft-fog',    count: 60, speed: 1,    opacity: 70  } },
    caustic: { label: '焦散水波', page: 'caustic' },
    clear:   { label: '晴天光网', page: 'sky', sky: { kind: 'clear',   strength: 100 } },
    cloudy:  { label: '多云',     page: 'sky', sky: { kind: 'cloudy',  strength: 55  } },
    storm:   { label: '雷雨',     page: 'sky', sky: { kind: 'storm',   strength: 50  } },
    haze:    { label: '霾',       page: 'sky', sky: { kind: 'fog',     strength: 50  } },
    rainbow: { label: '彩虹',     page: 'sky', sky: { kind: 'rainbow', strength: 75  } }
  };

  const phoneEl = document.getElementById('phone');
  const wallEl  = document.getElementById('wall');
  const frameEls = {
    glass:   document.getElementById('f-glass'),
    caustic: document.getElementById('f-caustic'),
    fx:      document.getElementById('f-fx'),
    sky:     document.getElementById('f-sky')
  };
  const READY_TYPE = {
    'weather-glass-ready':   'glass',
    'weather-caustic-ready': 'caustic',
    'weather-fx-ready':      'fx',
    'weather-sky-ready':     'sky'
  };
  const ready = { glass: false, caustic: false, fx: false, sky: false };
  const pending = { glass: [], caustic: [], fx: [], sky: [] };

  function send(page, msg) {
    if (!page) return;
    if (ready[page]) {
      try { frameEls[page].contentWindow.postMessage(msg, '*'); } catch (_) {}
      return;
    }
    // 还没就绪：同一个 op 只留最后一条，免得旧的排队值把新状态盖回去
    const queue = pending[page];
    const idx = queue.findIndex(function (m) { return m.type === msg.type && m.op === msg.op; });
    if (idx >= 0) queue[idx] = msg;
    else queue.push(msg);
  }

  function markReady(name) {
    if (ready[name]) return;
    ready[name] = true;
    const queue = pending[name];
    pending[name] = [];
    for (const msg of queue) {
      try { frameEls[name].contentWindow.postMessage(msg, '*'); } catch (_) {}
    }
  }

  window.addEventListener('message', function (e) {
    const name = READY_TYPE[e.data && e.data.type];
    if (name) markReady(name);
  });

  // 兜底：ready 消息万一比这个监听还早（慢网冷缓存），到 iframe 的 load 时补一次。
  for (const name of Object.keys(frameEls)) {
    frameEls[name].addEventListener('load', function () { markReady(name); });
  }

  /* ---------------- 气泡位置 → iframe ---------------- */
  const bubbleEls = Array.prototype.slice.call(
    document.querySelectorAll('#chat [data-b]')
  );
  let lastBubbleJson = '';

  function pushBubbles() {
    const p = phoneEl.getBoundingClientRect();
    const list = bubbleEls.map(function (el) {
      const r = el.getBoundingClientRect();
      return {
        i: el.dataset.b,
        l: Math.round(r.left - p.left), t: Math.round(r.top - p.top),
        r: Math.round(r.right - p.left), b: Math.round(r.bottom - p.top)
      };
    });
    const json = JSON.stringify(list);
    if (json === lastBubbleJson) return;
    lastBubbleJson = json;
    send('fx', { type: 'weather-fx', op: 'setBubbles', value: list });
  }
  setInterval(pushBubbles, 350);
  window.addEventListener('resize', function () { lastBubbleJson = ''; pushBubbles(); });

  /* ---------------- 壁纸 ---------------- */
  // 六张预置壁纸来自 wallpapers/walls.js（花瓣免费素材，页面标注非版权、可免费使用）。
  // 删掉 walls.js 也不会坏：下面 linear/blobs 会现画一张同色调的底色顶替。
  const WALLS = [
    { name: '霜林', key: 'frost',
      linear: ['#22344f', '#3a557a', '#16202f'],
      blobs: [[0.3, 0.2, 0.55, 'rgba(170,205,255,.35)'], [0.8, 0.3, 0.5, 'rgba(120,160,220,.22)']] },
    { name: '雾林', key: 'mist',
      linear: ['#1b2b26', '#33473c', '#111b17'],
      blobs: [[0.3, 0.2, 0.5, 'rgba(180,220,190,.22)'], [0.76, 0.5, 0.45, 'rgba(120,170,140,.2)']] },
    { name: '碧水', key: 'water',
      linear: ['#0b3030', '#12615c', '#0a2020'],
      blobs: [[0.4, 0.25, 0.55, 'rgba(120,255,235,.3)'], [0.75, 0.7, 0.5, 'rgba(60,200,190,.22)']] },
    { name: '海光', key: 'sea',
      linear: ['#123a3f', '#1f6f6a', '#0d2426'],
      blobs: [[0.3, 0.18, 0.5, 'rgba(220,255,245,.35)'], [0.7, 0.6, 0.5, 'rgba(90,210,200,.2)']] },
    { name: '落花', key: 'petals',
      linear: ['#123c40', '#1d6a6a', '#0c2426'],
      blobs: [[0.5, 0.2, 0.5, 'rgba(180,255,240,.28)'], [0.3, 0.7, 0.45, 'rgba(70,190,180,.2)']] },
    { name: '窗边', key: 'window',
      linear: ['#2b211a', '#4a382a', '#1a120d'],
      blobs: [[0.28, 0.4, 0.5, 'rgba(255,220,160,.35)'], [0.75, 0.25, 0.45, 'rgba(140,190,120,.22)']] }
  ];
  const LOCAL_WALLS = window.CORVUS_WALLS || {};
  WALLS.forEach(function (w) {
    if (LOCAL_WALLS[w.key]) w.src = LOCAL_WALLS[w.key];
    w.css = 'linear-gradient(180deg,' + w.linear.join(',') + ')';
  });
  const wallRow = document.getElementById('wallRow');
  let wallDataUrl = null;      // 雨水玻璃要用的背景（dataURL，跨 iframe 安全）
  let currentWallIdx = 0;      // 当前选中的预置壁纸
  let customWall = false;      // 换成自己的图之后，就不再覆盖

  // 把同一套配色画成图，给 raindrop-fx 当背景
  function paintWall(wall, w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const lg = g.createLinearGradient(0, 0, 0, h);
    wall.linear.forEach(function (color, i, arr) {
      lg.addColorStop(i / (arr.length - 1), color);
    });
    g.fillStyle = lg;
    g.fillRect(0, 0, w, h);
    (wall.blobs || []).forEach(function (b) {
      const rad = Math.max(w, h) * b[2] * 0.5;
      const rg = g.createRadialGradient(b[0] * w, b[1] * h, 0, b[0] * w, b[1] * h, rad);
      rg.addColorStop(0, b[3]);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg;
      g.fillRect(0, 0, w, h);
    });
    return c.toDataURL('image/jpeg', 0.9);
  }

  function wallImage(w) { return w.src ? 'url("' + w.src + '")' : w.css; }
  function setWall(image, isImage) {
    wallEl.style.backgroundImage = image;
    wallEl.style.backgroundSize = isImage ? 'cover' : '';
  }
  function applyWall(w, i) {
    setWall(wallImage(w), !!w.src);
    wallDataUrl = w.src || paintWall(w, 860, 1800);
    if (typeof i === 'number') currentWallIdx = i;
    pushGlassBackground();
  }
  function markSwatch(idx) {
    for (const b of wallRow.children) b.classList.toggle('on', Number(b.dataset.i) === idx);
  }
  function pushGlassBackground() {
    if (wallDataUrl) send('glass', { type: 'weather-glass', op: 'setBackground', value: wallDataUrl });
  }

  WALLS.forEach(function (w, i) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.dataset.i = String(i);
    b.title = w.name; b.setAttribute('aria-label', '壁纸：' + w.name);
    b.style.background = wallImage(w);
    b.style.backgroundSize = 'cover';
    b.style.backgroundPosition = 'center';
    b.addEventListener('click', function () {
      customWall = false;
      applyWall(w, i);
      markSwatch(i);
    });
    wallRow.appendChild(b);
  });

  document.getElementById('wallBtn').addEventListener('click', function () {
    document.getElementById('wallFile').click();
  });
  document.getElementById('wallFile').addEventListener('change', function () {
    const file = this.files && this.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      customWall = true;
      wallDataUrl = String(reader.result);
      setWall('url("' + wallDataUrl + '")', true);
      markSwatch(-1);
      pushGlassBackground();
    };
    reader.readAsDataURL(file);
  });

  /* ---------------- 参数面板 ---------------- */
  const chipsEl = document.getElementById('chips');
  const paramsEl = document.getElementById('params');
  let active = 'off';
  let fxParams = null;
  let frostLevel = 22;      // 边缘冰晶透明度（0~100），默认 22 跟原来一样
  let skyStrength = 55;

  for (const key of Object.keys(EFFECTS)) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.dataset.key = key;
    chip.textContent = EFFECTS[key].label;
    chip.addEventListener('click', function () { select(key); });
    chipsEl.appendChild(chip);
  }

  function slider(label, value, min, max, step, fmt, onInput) {
    const row = document.createElement('label');
    row.className = 'slider';
    const name = document.createElement('span');
    name.textContent = label;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = min; input.max = max; input.step = step; input.value = value;
    const out = document.createElement('output');
    out.textContent = fmt(value);
    input.addEventListener('input', function () {
      const v = Number(input.value);
      out.textContent = fmt(v);
      onInput(v);
    });
    row.append(name, input, out);
    return row;
  }

  function renderParams() {
    paramsEl.replaceChildren();
    const def = EFFECTS[active];
    if (def.page === 'fx' && fxParams) {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      const spec = { 'slant-snow': [50, 70, 5], 'rain-streak': [15, 120, 1],
                     'soft-snow': [12, 90, 1], 'soft-fog': [12, 90, 1] }[fxParams.effect] || [12, 120, 1];
      paramsEl.append(
        t,
        slider('数量', fxParams.count, spec[0], spec[1], spec[2], v => String(v), function (v) {
          fxParams.count = v;
          send('fx', { type: 'weather-fx', op: 'setCount', value: v });
        }),
        slider('速度', fxParams.speed, 0.25, 2, 0.05, v => v.toFixed(2) + '×', function (v) {
          fxParams.speed = v;
          send('fx', { type: 'weather-fx', op: 'setSpeed', value: v });
        }),
        slider('浓度', fxParams.opacity, 10, 100, 1, v => v + '%', function (v) {
          fxParams.opacity = v;
          send('fx', { type: 'weather-fx', op: 'setOpacity', value: v });
        })
      );
      if (fxParams.effect === 'slant-snow') {
        paramsEl.append(
          slider('冰晶', frostLevel, 0, 100, 1, v => v + '%', function (v) {
            frostLevel = v;
            send('fx', { type: 'weather-fx', op: 'setFrostOpacity', value: v });
          })
        );
      }
    } else if (def.page === 'sky' && def.sky) {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      paramsEl.append(
        t,
        slider('强度', skyStrength, 10, 130, 1, v => String(v), function (v) {
          skyStrength = v;
          send('sky', { type: 'weather-sky', op: 'setStrength', value: v });
        })
      );
    } else if (def.page === 'caustic') {
      paramsEl.className = 'group';
      const t = document.createElement('div');
      t.className = 'group-title';
      t.textContent = '参数';
      paramsEl.append(
        t,
        slider('亮度', 100, 0, 160, 1, v => v + '%', function (v) {
          send('caustic', { type: 'weather-caustic', op: 'setPower', value: v });
        }),
        slider('透出', 55, 0, 100, 1, v => v + '%', function (v) {
          send('caustic', { type: 'weather-caustic', op: 'setOpacity', value: v });
        })
      );
    } else {
      paramsEl.className = '';
    }
  }

  /* ---------------- 切特效 ---------------- */
  function showOnly(page) {
    for (const name of Object.keys(frameEls)) {
      const on = name === page;
      frameEls[name].classList.toggle('on', on);
      if (name === 'fx')    send('fx',    { type: 'weather-fx',    op: 'setPaused', value: !on });
      if (name === 'sky')   send('sky',   { type: 'weather-sky',   op: 'setPaused', value: !on });
      if (name === 'glass') send('glass', { type: 'weather-glass', op: on ? 'start' : 'stop' });
    }
  }

  function select(key) {
    if (!EFFECTS[key]) return;
    active = key;
    const def = EFFECTS[key];

    for (const chip of chipsEl.children) chip.classList.toggle('on', chip.dataset.key === key);
    showOnly(def.page);

    if (def.page === 'fx') {
      fxParams = Object.assign({}, def.fx);
      send('fx', { type: 'weather-fx', op: 'setEffect',  value: fxParams.effect });
      send('fx', { type: 'weather-fx', op: 'setCount',   value: fxParams.count });
      send('fx', { type: 'weather-fx', op: 'setSpeed',   value: fxParams.speed });
      send('fx', { type: 'weather-fx', op: 'setOpacity', value: fxParams.opacity });
      send('fx', { type: 'weather-fx', op: 'setFrost',      value: fxParams.effect === 'slant-snow' });
      send('fx', { type: 'weather-fx', op: 'setFrostOpacity', value: frostLevel });
      send('fx', { type: 'weather-fx', op: 'setSplash',     value: key === 'streak' });
      send('fx', { type: 'weather-fx', op: 'setAccumulate', value: key === 'soft' });
      lastBubbleJson = '';
      pushBubbles();
    } else {
      send('fx', { type: 'weather-fx', op: 'setFrost', value: false });
      send('fx', { type: 'weather-fx', op: 'setSplash', value: false });
      send('fx', { type: 'weather-fx', op: 'setAccumulate', value: false });
      if (def.page === null) {
        send('sky', { type: 'weather-sky', op: 'setState', value: 'none' });
      }
    }
    if (def.page === 'sky') {
      skyStrength = def.sky.strength;
      send('sky', { type: 'weather-sky', op: 'setStrength', value: def.sky.strength });
      send('sky', { type: 'weather-sky', op: 'setState',    value: def.sky.kind });
    }
    if (def.page === 'glass') pushGlassBackground();
    renderParams();
  }

  /* ---------------- 启动 ---------------- */
  const qs = new URLSearchParams(location.search);
  if (qs.get('shot') === '1') document.body.classList.add('shot');

  const KEY_BY_PARAM = {
    rain: 'streak', streak: 'streak', slant: 'slant', soft: 'soft', fog: 'fog',
    glass: 'glass', caustic: 'caustic', clear: 'clear', cloudy: 'cloudy',
    storm: 'storm', haze: 'haze', rainbow: 'rainbow', off: 'off'
  };
  const fxKey = KEY_BY_PARAM[qs.get('fx') || ''] || 'slant';

  const wallIdx = Math.max(0, Math.min(WALLS.length - 1, Number(qs.get('wall') || 0) - 1));
  applyWall(WALLS[wallIdx], wallIdx);
  markSwatch(wallIdx);

  // 壁纸数据（2MB 的 dataURL）异步加载，不挡主脚本——
  // 否则慢网冷缓存时，父页的监听会比 iframe 的 ready 消息还晚，特效就切不动。
  (function loadWallData() {
    const s = document.createElement('script');
    s.src = 'wallpapers/walls.js';
    s.onload = function () {
      const local = window.CORVUS_WALLS || {};
      let added = false;
      WALLS.forEach(function (w, i) {
        if (w.src || !local[w.key]) return;
        w.src = local[w.key];
        const b = wallRow.children[i];
        if (b) {
          b.style.background = wallImage(w);
          b.style.backgroundSize = 'cover';
          b.style.backgroundPosition = 'center';
        }
        added = true;
      });
      if (added && !customWall) applyWall(WALLS[currentWallIdx], currentWallIdx);
    };
    document.body.appendChild(s);
  })();

  select(fxKey);
})();
</script>
</body>
</html>
